name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Проверить структуру и версии
        run: python scripts/validate.py
      - name: Тесты установщика
        run: python -m unittest discover -s tests -v
      - name: Собрать архивы
        run: python scripts/package.py --out dist
      - name: Установить скилл из репозитория
        working-directory: cli
        run: python -m antislop.cli install --source .. --dir /tmp/man-test --force
      - name: Проверить манифест установки
        run: |
          test -f /tmp/man-test/anti-neuroslop/SKILL.md
          test -f /tmp/man-test/anti-neuroslop/references/katalog.md
          python -c "import json;print(json.load(open('/tmp/man-test/anti-neuroslop/.man.json'))['version'])"
      - name: Удалить скилл
        working-directory: cli
        run: |
          python -m antislop.cli uninstall --dir /tmp/man-test
          test ! -d /tmp/man-test/anti-neuroslop
      - name: Проверить установку скриптом
        run: |
          sh scripts/install.sh --dir /tmp/man-sh --force
          test -f /tmp/man-sh/anti-neuroslop/SKILL.md
          sh scripts/install.sh --dir /tmp/man-sh --uninstall
          test ! -d /tmp/man-sh/anti-neuroslop

  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Собрать MAN-Setup.exe и проверить установку
        shell: pwsh
        run: ./installer/windows/build.ps1 -Test
